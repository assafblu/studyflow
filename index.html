<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Tutor</title><link rel="icon" type="image/png" href="icon-192.png"><link rel="apple-touch-icon" href="apple-touch-icon.png"><link rel="manifest" href="manifest.webmanifest"><meta name="apple-mobile-web-app-title" content="Tutor"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#FFFFFF;--surface:#F5F5F5;--ink:#111111;--ink2:#6E6E6E;--ink3:#9E9E9E;--line:#E5E5E5;--line2:#CFCFCF;--track:#E5E5E5;
  --accent:#111111;--on-accent:#FFFFFF;--accent-soft:#F0F0F0;--pop:#FA5400;
  --good:#1A8F4E;--good-soft:#E4F4EA;--warn:#C46A00;--warn-soft:#FFF0DB;--bad:#D30005;--bad-soft:#FDE8E8;
  --hero:#111111;--on-hero:#FFFFFF;--r:20px;--rs:14px;--ease:cubic-bezier(.2,.7,.2,1);color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0B0B0B;--surface:#1A1A1A;--ink:#FFFFFF;--ink2:#A3A3A3;--ink3:#6B6B6B;--line:#2A2A2A;--line2:#3A3A3A;--track:#2E2E2E;
    --accent:#FFFFFF;--on-accent:#111111;--accent-soft:#262626;--pop:#FF6A2B;
    --good:#4CC38A;--good-soft:#12261D;--warn:#F0A040;--warn-soft:#2B2210;--bad:#FF6B6B;--bad-soft:#2C1615;
    --hero:#1F1F1F;color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0B0B0B;--surface:#1A1A1A;--ink:#FFFFFF;--ink2:#A3A3A3;--ink3:#6B6B6B;--line:#2A2A2A;--line2:#3A3A3A;--track:#2E2E2E;
  --accent:#FFFFFF;--on-accent:#111111;--accent-soft:#262626;--pop:#FF6A2B;
  --good:#4CC38A;--good-soft:#12261D;--warn:#F0A040;--warn-soft:#2B2210;--bad:#FF6B6B;--bad-soft:#2C1615;
  --hero:#1F1F1F;color-scheme:dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:Heebo,system-ui,-apple-system,"Segoe UI",Arial,sans-serif;font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer}
h1,h2,h3,p{margin:0}
h1{font-size:34px;line-height:1.05;font-weight:800;letter-spacing:-.01em}
h2{font-size:24px;line-height:1.15;font-weight:800;letter-spacing:-.01em}
.sub{color:var(--ink2);font-size:15px;margin-top:6px}
.center{text-align:center}
#app{max-width:480px;margin:0 auto;min-height:100dvh;position:relative}
@media (min-width:520px){#app{border-inline:1px solid var(--line)}}
.page{padding:28px 20px 120px;animation:in .3s var(--ease) both}
html.vt .page{animation:none}
.still .page,.still .rf,.still .bar i{animation:none!important}
::view-transition-old(root),::view-transition-new(root){animation-duration:.22s;animation-timing-function:ease}
@keyframes in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes fade{from{opacity:0}}
@keyframes up{from{transform:translateY(28px);opacity:0}}
:focus-visible{outline:2px solid var(--ink);outline-offset:2px}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:52px;padding:0 28px;border:0;border-radius:999px;background:var(--accent);color:var(--on-accent);font-weight:600;font-size:16px;line-height:1;transition:transform .15s var(--ease),opacity .2s,background .2s;white-space:nowrap}
.btn:active{transform:scale(.96)}
.btn[disabled]{opacity:.45}
.btn.block{width:100%}
.btn.tonal{background:var(--surface);color:var(--ink)}
.btn.ghost{background:transparent;color:var(--ink2)}
.btn.sm{height:40px;padding:0 18px;font-size:14px}
.btn.danger{background:var(--bad-soft);color:var(--bad)}
.btn.light{background:#fff;color:#111}
@media (hover:hover){.btn:hover{opacity:.86}.opt:hover:not([disabled]){border-color:var(--ink)}.li:hover .t{text-decoration:underline}}
.icon-btn{width:44px;height:44px;border:0;background:transparent;border-radius:50%;display:grid;place-items:center;color:var(--ink);transition:background .15s}
.icon-btn:active{background:var(--surface)}
.ic{width:22px;height:22px;flex:none}
.btn.sm .ic{width:18px;height:18px}
.lbl{display:block;font-size:14px;font-weight:600;color:var(--ink);margin:0 0 8px}
.field{margin-bottom:18px}
.inp{width:100%;height:54px;border:1px solid var(--line2);border-radius:var(--rs);background:var(--bg);color:var(--ink);padding:0 16px;font:inherit;font-size:16px;outline:none;transition:border-color .15s,box-shadow .15s}
.inp:focus{border-color:var(--ink);box-shadow:0 0 0 1px var(--ink)}
.inp.ta{height:120px;padding:14px 16px;resize:none;line-height:1.5}
.err{min-height:22px;color:var(--bad);font-size:14px;margin:4px 0 12px}
.seg{display:flex;flex-wrap:wrap;gap:8px}
.seg button{border:1px solid var(--line2);background:transparent;height:40px;padding:0 18px;border-radius:999px;font-size:14px;font-weight:600;color:var(--ink);transition:background .2s,color .2s,border-color .2s,transform .12s}
.seg button:active{transform:scale(.96)}
.seg button.on{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.surface{background:var(--surface);border-radius:var(--r)}
.sec{font-size:20px;font-weight:800;margin:36px 0 12px;display:flex;align-items:center}
.cnt{background:var(--pop);color:#fff;border-radius:999px;font-size:12px;font-weight:700;padding:2px 9px;margin-inline-start:8px;line-height:1.5}
.note{background:var(--surface);border-inline-start:3px solid var(--pop);border-radius:var(--rs);padding:14px 16px;font-size:15px;line-height:1.5;margin-top:20px}
.note button{border:0;background:none;color:var(--ink);font-weight:700;text-decoration:underline;padding:0;margin-inline-start:8px}

.bar{height:4px;background:var(--track);border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;width:calc(var(--p)*1%);background:var(--ink);border-radius:99px;animation:barin .8s var(--ease) both}
.bar.warn i{background:var(--pop)}
@keyframes barin{from{width:0}}
.ring{position:relative;display:grid;place-items:center;flex:none}
.ring b{position:absolute;font-size:18px;font-weight:800}
.ring b small{font-size:11px;font-weight:600;opacity:.6;margin-inline-start:1px}
.ring.lg b{font-size:42px}.ring.lg b small{font-size:18px}
.rt{stroke:var(--track)}
.rf{stroke:var(--pop);stroke-dasharray:var(--c);stroke-dashoffset:calc(var(--c)*(1 - var(--p)/100));animation:ringin 1s var(--ease) both}
@keyframes ringin{from{stroke-dashoffset:var(--c)}}

.welcome{--accent:#FFFFFF;--on-accent:#111111;--ink:#FFFFFF;--ink2:#A3A3A3;--bg:#000000;--surface:#1F1F1F;--line2:#3A3A3A;background:#000;color:#fff;min-height:100dvh;display:flex;flex-direction:column;justify-content:space-between;padding:32px 24px calc(32px + env(safe-area-inset-bottom))}
.brand{display:flex;align-items:center;gap:12px}
.wm{font-size:20px;font-weight:800;direction:ltr}
.hl h1{font-size:52px;line-height:1;font-weight:900;letter-spacing:-.02em}
.stack{display:grid;gap:12px}
.linkbtn{border:0;background:none;color:var(--ink);font-weight:700;padding:8px;text-decoration:underline;text-underline-offset:3px}
.topbar{display:flex;align-items:center;justify-content:space-between;margin:-10px -10px 20px}

.hero{background:var(--hero);color:var(--on-hero);border:0;border-radius:var(--r);padding:26px 24px;display:grid;grid-template-columns:1fr auto;gap:16px;align-items:center;width:100%;text-align:start;transition:transform .18s var(--ease)}
.hero:active{transform:scale(.985)}
.hero h2{font-size:34px;font-weight:900;line-height:1.05}
.hero .sub{color:rgba(255,255,255,.7)}
.hero .lab{margin-top:14px;font-size:14px;font-weight:700;color:var(--pop)}
.hero .rt{stroke:rgba(255,255,255,.2)}
.hero.col{display:block}
.hero.col .btn{margin-top:20px}
.focus{padding:20px 22px;display:flex;align-items:center;justify-content:space-between;gap:16px}
.focus .ft{font-size:20px;font-weight:800}
.empty{padding:56px 8px;text-align:center;display:grid;gap:14px;justify-items:center}
.empty p{color:var(--ink2);max-width:300px}
.fabwrap{position:fixed;bottom:calc(84px + env(safe-area-inset-bottom));left:0;right:0;margin:auto;width:min(100%,480px);padding-inline:20px;display:flex;justify-content:flex-start;pointer-events:none;z-index:5}
.fab{pointer-events:auto;width:60px;height:60px;border:0;border-radius:50%;background:var(--accent);color:var(--on-accent);display:grid;place-items:center;box-shadow:0 8px 24px rgba(0,0,0,.25);transition:transform .15s var(--ease)}
.fab:active{transform:scale(.92)}
.fab .ic{width:26px;height:26px}

.list{border-top:1px solid var(--line)}
.li{display:flex;align-items:center;gap:16px;width:100%;padding:18px 0;border:0;border-bottom:1px solid var(--line);background:none;text-align:start}
.li .grow{flex:1;min-width:0}
.li .t{font-weight:700;font-size:17px}
.li .m{font-size:14px;color:var(--ink2)}
.li .r{text-align:end;min-width:76px}
.li .r b{display:block;font-size:15px;font-weight:700}
.li .r span{font-size:13px;color:var(--ink2)}
.li .bar{margin-top:10px}
.li>.ic{color:var(--ink3)}
.newdot{width:9px;height:9px;border-radius:50%;background:var(--pop);flex:none}
.set{display:flex;align-items:center;justify-content:space-between;gap:16px;min-height:58px;padding:10px 20px;border:0;border-bottom:1px solid var(--line);background:none;width:100%;text-align:start}
.set:last-child{border-bottom:0}
.set .v{color:var(--ink2);font-size:15px;display:flex;align-items:center;gap:8px}
.grp{overflow:hidden}
.grp-t{font-size:14px;font-weight:700;margin:32px 4px 10px}
.stepper{display:flex;align-items:center;gap:6px}
.stepper button{width:38px;height:38px;border:1px solid var(--line2);background:transparent;border-radius:50%;font-size:18px}
.stepper span{min-width:64px;text-align:center;font-weight:700}
.days{display:flex;gap:6px}
.days button{width:36px;height:36px;border-radius:50%;border:1px solid var(--line2);background:transparent;font-size:13px;font-weight:700;color:var(--ink);transition:all .15s}
.days button.on{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.tg{width:50px;height:30px;border:0;border-radius:99px;background:var(--line2);position:relative;transition:background .25s;flex:none;padding:0}
.tg::after{content:'';position:absolute;top:3px;inset-inline-start:3px;width:24px;height:24px;border-radius:50%;background:var(--bg);transition:transform .25s var(--ease)}
.tg.on{background:var(--ink)}
.tg.on::after{transform:translateX(-20px)}
.time{background:var(--bg);border-radius:var(--rs);padding:8px 12px;font:inherit;color:var(--ink);border:1px solid var(--line2)}

.ehead{display:flex;align-items:center;gap:8px;margin:-10px -10px 14px}
.ready{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-top:24px;padding:22px}
.ready .lab{font-weight:800;font-size:20px;margin-top:2px}
.tl{margin-top:8px}
.step{position:relative;display:grid;grid-template-columns:28px 1fr auto;gap:14px;align-items:start;padding-bottom:26px}
.step::before{content:'';position:absolute;inset-inline-start:13px;top:30px;bottom:2px;width:2px;background:var(--line);border-radius:2px}
.step:last-child::before{display:none}
.step.done::before{background:var(--ink);transform-origin:top;animation:grow .5s var(--ease) both}
@keyframes grow{from{transform:scaleY(0)}}
.dot{width:28px;height:28px;border-radius:50%;border:2px solid var(--line2);display:grid;place-items:center;background:var(--bg);transition:all .3s var(--ease)}
.dot .ic{width:15px;height:15px;stroke-width:2.6}
.step.done .dot{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.step.cur .dot{border-color:var(--pop)}
.step.cur .dot::after{content:'';width:10px;height:10px;border-radius:50%;background:var(--pop)}
.step .st{font-weight:700;font-size:17px;line-height:28px}
.step .sm2{font-size:14px;color:var(--ink2);margin-top:-2px}
.step.up .st{color:var(--ink2)}

.qhead{display:flex;align-items:center;justify-content:space-between;margin:-10px -10px 14px}
.qhead span{font-size:14px;color:var(--ink2);font-weight:600}
.qhead i{width:44px}
.q{font-size:24px;line-height:1.35;font-weight:800;margin:32px 0 26px;unicode-bidi:plaintext;letter-spacing:-.01em}
.opts{display:grid;gap:10px}
.opt{display:flex;align-items:center;gap:12px;width:100%;min-height:60px;padding:12px 18px;border:1.5px solid var(--line2);border-radius:var(--r);background:var(--bg);text-align:start;transition:border-color .15s,background .2s,transform .12s var(--ease),opacity .2s}
.opt:active:not([disabled]){transform:scale(.985)}
.opt .lt{width:28px;height:28px;border-radius:50%;border:1.5px solid var(--line2);display:grid;place-items:center;font-size:13px;font-weight:700;color:var(--ink2);flex:none}
.opt span[dir]{unicode-bidi:plaintext}
.opt.ok{border-color:var(--good);background:var(--good-soft)}
.opt.no{border-color:var(--bad);background:var(--bad-soft)}
.opt.dim{opacity:.5}
.fb{margin-top:20px;padding:16px 18px;border-radius:var(--r);font-size:15px;animation:in .25s var(--ease) both}
.fb.ok{background:var(--good-soft)}.fb.no{background:var(--bad-soft)}
.fb b{display:block;margin-bottom:2px;font-weight:800}
.fb.ok b{color:var(--good)}.fb.no b{color:var(--bad)}
.fb p{color:var(--ink2);margin-top:4px;unicode-bidi:plaintext}
.foot{position:sticky;bottom:0;background:var(--bg);padding:16px 0 calc(16px + env(safe-area-inset-bottom));margin-top:24px}
.flow{width:120px;height:44px}
.flow path{fill:none;stroke:var(--pop);stroke-width:3.5;stroke-linecap:round;stroke-dasharray:60 200;animation:dash 1.5s linear infinite}
@keyframes dash{to{stroke-dashoffset:-260}}
.load{min-height:70dvh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;text-align:center}
.rscore{display:grid;place-items:center;margin:8px 0 22px}
.brk{display:grid;gap:18px;margin-top:8px}
.brk div.h{display:flex;justify-content:space-between;font-size:15px;margin-bottom:8px}
.brk div.h b{font-weight:800}
.fs{padding:18px 22px}
.fs b{font-size:19px;display:block;font-weight:800}
.fs p{color:var(--ink2);font-size:14px;margin-top:4px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);margin-top:28px}
.stats div{padding:0 4px;text-align:center}
.stats div+div{border-inline-start:1px solid var(--line)}
.stats b{display:block;font-size:28px;font-weight:900;letter-spacing:-.01em}
.stats span{font-size:13px;color:var(--ink2)}
.stats .up{color:var(--good)}.stats .down{color:var(--pop)}
.spark{width:100%;height:56px;margin-top:22px;display:block}
.spark path{fill:none;stroke:var(--ink);stroke-width:2;stroke-linecap:round;stroke-linejoin:round;vector-effect:non-scaling-stroke}
.tp{display:flex;align-items:center;gap:8px}
.tp .x{width:34px;height:34px;border:0;background:none;color:var(--ink3);border-radius:50%}
.tp .lvl{border:0;background:var(--surface);color:var(--ink);font-size:13px;font-weight:600;padding:6px 12px;border-radius:999px}
.tprow{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:8px 0;border-bottom:1px solid var(--line)}
.addrow{display:flex;gap:8px}
.addrow .btn{width:54px;padding:0;height:54px;flex:none}

.post{background:var(--surface);border-radius:var(--r);padding:20px;margin-bottom:12px}
.post.new{box-shadow:inset 0 0 0 1.5px var(--pop)}
.post .kind{display:inline-block;font-size:12px;font-weight:800;color:var(--pop);margin-bottom:6px}
.post h3{font-size:19px;font-weight:800;line-height:1.3}
.post .body{color:var(--ink2);font-size:15px;line-height:1.55;margin-top:8px;white-space:pre-wrap;unicode-bidi:plaintext}
.post .when{font-size:14px;font-weight:700;margin-top:10px}
.post .pf{display:flex;align-items:center;gap:12px;margin-top:16px;flex-wrap:wrap}
.post .m{font-size:13px;color:var(--ink2)}
.thumb{height:42px;padding:0 18px;border-radius:999px;border:1.5px solid var(--ink);background:transparent;font-weight:700;font-size:14px;transition:background .2s,color .2s,transform .15s var(--ease)}
.thumb:active{transform:scale(.94)}
.thumb.on{background:var(--ink);color:var(--bg)}
.code{font-size:44px;font-weight:900;letter-spacing:.14em;direction:ltr;text-align:center;padding:22px 0 14px}
.av{width:42px;height:42px;border-radius:50%;background:var(--surface);display:grid;place-items:center;font-weight:800;flex:none}
.av.t{background:var(--ink);color:var(--bg)}
.tagt{font-size:12px;font-weight:800;background:var(--surface);border-radius:999px;padding:2px 10px;margin-inline-start:8px}

.nav{position:fixed;bottom:0;left:0;right:0;margin:auto;width:min(100%,480px);display:grid;grid-template-columns:repeat(var(--n,4),1fr);padding:6px 0 calc(6px + env(safe-area-inset-bottom));background:color-mix(in srgb,var(--bg) 92%,transparent);-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);border-top:1px solid var(--line);z-index:10}
.nav[hidden]{display:none}
.nav button{position:relative;border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 0 4px;color:var(--ink3);font-size:12px;font-weight:600;transition:color .2s}
.nav button.on{color:var(--ink)}
.nav .bdg{display:none;position:absolute;top:7px;inset-inline-end:calc(50% - 19px);width:9px;height:9px;border-radius:50%;background:var(--pop)}
.nav button.un .bdg{display:block}
.nav .ind{position:absolute;top:-1px;inset-inline-start:0;width:calc(100%/var(--n,4));height:2px;display:flex;justify-content:center;transform:translateX(calc(var(--i,0)*-100%));transition:transform .35s var(--ease)}
.nav .ind i{width:28px;height:2px;background:var(--ink);border-radius:2px}
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.5);animation:fade .2s both;z-index:40}
.sheet{position:fixed;bottom:0;left:0;right:0;margin:auto;width:min(100%,480px);max-height:92dvh;overflow:auto;background:var(--bg);border-radius:28px 28px 0 0;padding:12px 22px calc(28px + env(safe-area-inset-bottom));animation:up .3s var(--ease) both;z-index:41}
.grab{display:block;width:36px;height:4px;border-radius:4px;background:var(--line2);margin:0 auto 22px}
.sheet h2{margin-bottom:8px}
.sheet p{color:var(--ink2)}
.sheet .stack{margin-top:24px}
.sheet .meta{margin-top:16px;font-size:14px;color:var(--ink2)}
#toast{position:fixed;bottom:calc(100px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%) translateY(8px);background:var(--ink);color:var(--bg);padding:12px 20px;border-radius:999px;font-size:14px;font-weight:600;opacity:0;pointer-events:none;transition:all .3s var(--ease);z-index:60;max-width:90vw;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#toast.on{opacity:1;transform:translateX(-50%)}
.chk{width:30px;height:30px;border-radius:50%;border:2px solid var(--line2);background:transparent;display:grid;place-items:center;flex:none;padding:0;color:var(--bg);transition:all .2s var(--ease)}
.chk:active{transform:scale(.9)}
.chk.on{background:var(--ink);border-color:var(--ink)}
.chk .ic{width:16px;height:16px;stroke-width:2.6}
.tap{border:0;background:none;text-align:start;flex:1;min-width:0;padding:0}
.li.done .t{text-decoration:line-through;color:var(--ink3)}
.due{font-weight:700}.due.hot{color:var(--pop)}
.big{font-size:54px;font-weight:900;line-height:1;text-align:center}
.big small{display:block;font-size:13px;font-weight:600;opacity:.7;margin-top:4px}
.quick{display:flex;gap:8px;flex-wrap:wrap;margin-top:18px}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}}
</style>
</head>
<body>
<div id="app">
  <main id="view"></main>
  <nav id="nav" class="nav" hidden aria-label="ניווט ראשי"></nav>
</div>
<div id="layer"></div>
<div id="toast" role="status" aria-live="polite"></div>

<script type="module">
import{initializeApp}from"https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";

/* ================= state ================= */
let U=null,D=null,FU=null,pending=null,svT=null,deleting=false,V={name:'splash',p:{}};
const main=document.getElementById('view'),navEl=document.getElementById('nav'),layer=document.getElementById('layer');
const defaults=()=>({exams:[],classCodes:[],lastNotified:'',settings:{reminderTime:'18:00',theme:'system',notif:{teacher:true,hw:true,exam:true}}});
const save=()=>{if(!U||deleting)return;clearTimeout(svT);svT=setTimeout(flushSave,500)};
const isT=()=>!!U&&U.role==='teacher';
const myCodes=()=>(D&&D.classCodes)||[];
const emptyC=()=>({classes:[],members:[],posts:[],reacts:[],homework:[],hwdone:[],exams:[],loaded:false});
let C=emptyC(),DB=null,subs=[],syncGen=0;
const bootAt=Date.now();
const cls=code=>C.classes.find(c=>c.code===code);
const cname=code=>{const c=cls(code);return c?c.name:''};
const ini=n=>String(n||'?').trim().charAt(0);
const byDate=(k)=>(a,b)=>a[k]<b[k]?-1:a[k]>b[k]?1:0;
function examsAll(){
  const mine=isT()?[]:D.exams.map(e=>Object.assign({src:'me'},e));
  const cl=C.exams.filter(e=>!isT()||e.authorId===U.id).map(e=>Object.assign({src:'class'},e));
  return mine.concat(cl).sort(byDate('date'));
}
const hwMine=()=>C.homework.filter(h=>!isT()||h.authorId===U.id).sort(byDate('due'));
const hwIsDone=h=>C.hwdone.some(x=>x.hwId===h.id&&x.uid===U.id);
const unack=()=>C.posts.filter(p=>p.authorId!==U.id&&!C.reacts.some(r=>r.postId===p.id&&r.uid===U.id));
const unread=()=>U&&!isT()?unack().length:0;
const KINDS={note:'הודעה',change:'שינוי',event:'טקס / אירוע',reminder:'תזכורת'};

/* ================= render / nav ================= */
const views={};
function go(name,p,anim){V={name:name,p:p||{}};render(anim!==false)}
function render(anim){
  const f=views[V.name],y=window.scrollY;
  const apply=()=>{
    main.classList.toggle('still',!anim);
    main.innerHTML=f(V.p);
    if(anim)window.scrollTo(0,0);else window.scrollTo(0,y);
    setNav();
  };

const AMSG={'auth/email-already-in-use':'כבר קיים חשבון עם האימייל הזה. אפשר להתחבר.','auth/invalid-credential':'האימייל או הסיסמה שגויים.','auth/wrong-password':'האימייל או הסיסמה שגויים.','auth/user-not-found':'האימייל או הסיסמה שגויים.','auth/weak-password':'הסיסמה צריכה לכלול לפחות 6 תווים.','auth/too-many-requests':'יותר מדי ניסיונות. נסו שוב בעוד כמה דקות.','auth/network-request-failed':'אין חיבור לרשת.','auth/operation-not-allowed':'שיטת ההתחברות לא הופעלה בפרויקט Firebase.','auth/invalid-email':'כתובת האימייל לא תקינה.'};
const authMsg=e=>AMSG[e&&e.code]||'משהו השתבש. נסו שוב.';
function makeDB(){
  const conv=s=>({id:s.id,exists:s.exists(),data:()=>s.data(),metadata:s.metadata});
  const ref=p=>fDoc(fs,...p.split('/'));
  return{
    doc:p=>({get:async()=>conv(await getDoc(ref(p))),set:d=>setDoc(ref(p),d),update:d=>updateDoc(ref(p),d),delete:()=>deleteDoc(ref(p))}),
    collection:col=>{
      const build=cons=>({where:(f,op,v)=>build(cons.concat([fWhere(f,op,v)])),onSnapshot:(fn,er)=>fOnSnap(query(fCol(fs,col),...cons),s=>fn({docs:s.docs.map(conv),metadata:s.metadata}),er||(()=>{}))});
      return Object.assign(build([]),{add:d=>addDoc(fCol(fs,col),d)});
    }
  };
}
DB=makeDB();

const COLS=['classes','members','posts','reacts','homework','hwdone','exams'];
function stopSync(){subs.forEach(f=>{try{f()}catch(e){}});subs=[];syncGen++;C=emptyC()}
function onSync(){if(!U)return;if(['home','exams','exam','hw','classes','class'].includes(V.name))render(false);else setNav()}
function startSync(){
  subs.forEach(f=>{try{f()}catch(e){}});subs=[];C=emptyC();
  const codes=myCodes().slice(0,30),gen=++syncGen;
  if(!U||!codes.length){onSync();return}
  COLS.forEach(col=>{
    subs.push(DB.collection(col).where('code','in',codes).onSnapshot(s=>{
      if(gen!==syncGen)return;
      const prev=new Set(C[col].map(x=>x.id));
      C[col]=s.docs.map(d=>Object.assign({id:d.id},d.data()));
      if(col==='classes'&&!s.metadata.fromCache)C.loaded=true;
      if(col==='posts'||col==='homework'||col==='exams')C[col].forEach(p=>{if(!prev.has(p.id)&&p.authorId!==U.id&&p.at>bootAt)notifyNew(col,p)});
      onSync();
    },()=>onSync()));
  });
}

      const row=(m,ok)=>'<div class="li" style="padding:10px 0"><span class="av">'+esc(ini(m.name))+'</span><div class="grow t">'+esc(m.name)+'</div><span>'+(ok?'✓':'')+'</span></div>';
      s+='<h3 class="sec" style="margin-top:20px">הגישו ('+mem.filter(m=>ids.has(m.uid)).length+')</h3>'+(mem.filter(m=>ids.has(m.uid)).map(m=>row(m,true)).join('')||'<p class="sub">עדיין אף אחד.</p>')+'<h3 class="sec">עוד לא ('+mem.filter(m=>!ids.has(m.uid)).length+')</h3>'+(mem.filter(m=>!ids.has(m.uid)).map(m=>row(m,false)).join('')||'<p class="sub">כולם הגישו.</p>')+'<div class="stack"><button class="btn block danger" data-a="delHw" data-id="'+h.id+'">מחיקת שיעורי הבית</button></div>';
    }else s+='<div class="stack"><button class="btn block" data-a="hwToggleClose" data-id="'+h.id+'">'+(hwIsDone(h)?'לא הושלם':'סימון כבוצע')+'</button></div>';
    sheet(s);
  },
  hwToggleClose(d){closeSheet();A.hwToggle(d)},
  async delHw(d){closeSheet();try{await Promise.all(C.hwdone.filter(x=>x.hwId===d.id).map(x=>DB.doc('hwdone/'+x.id).delete()));await DB.doc('homework/'+d.id).delete();toast('נמחק')}catch(e){dbFail(e)}},
  whoRead(d){
    const p=C.posts.find(x=>x.id===d.id);if(!p)return;
    const rs=C.reacts.filter(r=>r.postId===p.id),ids=new Set(rs.map(r=>r.uid)),mem=C.members.filter(m=>m.code===p.code),no=mem.filter(m=>!ids.has(m.uid));
    const rows=(arr,ok)=>arr.length?arr.map(n=>'<div class="li" style="padding:10px 0"><span class="av">'+esc(ini(n))+'</span><div class="grow t">'+esc(n)+'</div><span>'+(ok?'👍':'')+'</span></div>').join(''):'<p class="sub">אף אחד.</p>';
    sheet('<h2>מי הבין</h2><p dir="auto">'+esc(p.title)+'</p><h3 class="sec" style="margin-top:20px">סימנו 👍 ('+rs.length+')</h3>'+rows(rs.map(r=>r.name),true)+'<h3 class="sec">עוד לא ('+no.length+')</h3>'+rows(no.map(m=>m.name),false));
  },
  delPost(d){sheet('<h2>למחוק את העדכון?</h2><p>העדכון ייעלם מהכיתה.</p><div class="stack"><button class="btn block danger" data-a="delPostYes" data-id="'+d.id+'">מחיקה</button><button class="btn block ghost" data-a="closeSheet">ביטול</button></div>')},
  async delPostYes(d){closeSheet();try{await Promise.all(C.reacts.filter(r=>r.postId===d.id).map(r=>DB.doc('reacts/'+r.id).delete()));await DB.doc('posts/'+d.id).delete();toast('העדכון נמחק')}catch(e){dbFail(e)}},
  delExam(d){sheet('<h2>למחוק את המבחן?</h2><p>'+(isT()?'המבחן יימחק לכל הכיתה.':'המבחן יימחק מהרשימה שלכם.')+'</p><div class="stack"><button class="btn block danger" data-a="delExamYes" data-id="'+d.id+'">מחיקה</button><button class="btn block ghost" data-a="closeSheet">ביטול</button></div>')},
  async delExamYes(d){
    closeSheet();
    try{
      if(D.exams.some(e=>e.id===d.id)){D.exams=D.exams.filter(e=>e.id!==d.id);save()}
      else await DB.doc('exams/'+d.id).delete();
      go('exams');
    }catch(e){dbFail(e)}
  },
  person(d){
    const c=cls(d.code);if(!c)return;
    const isTeacherRow=d.u===c.teacherId,m=C.members.find(x=>x.code===d.code&&x.uid===d.u);
    const name=isTeacherRow?c.teacherName:(m?m.name:'');
    let s='<div style="display:flex;align-items:center;gap:16px"><span class="av'+(isTeacherRow?' t':'')+'" style="width:64px;height:64px;font-size:26px">'+esc(ini(name))+'</span><div><h2 style="margin:0">'+esc(name)+'</h2><p>'+(isTeacherRow?'מורה':'תלמיד/ה')+' · '+esc(c.name)+'</p></div></div>';
    if(m)s+='<p class="sub" style="margin-top:20px">הצטרף/ה לכיתה ב־'+dLong(fmt(new Date(m.joinedAt)))+'</p>';
    if(isT()&&m){
      const posts=C.posts.filter(p=>p.code===d.code).length,ack=C.reacts.filter(r=>r.code===d.code&&r.uid===d.u).length;
      const hws=C.homework.filter(h=>h.code===d.code),dn=C.hwdone.filter(x=>x.code===d.code&&x.uid===d.u),ids=new Set(dn.map(x=>x.hwId));
      const late=hws.filter(h=>h.due<todayStr()&&!ids.has(h.id)).length;
      s+='<div class="stats"><div><b>'+ack+'/'+posts+'</b><span>עדכונים שאושרו</span></div><div><b>'+dn.length+'/'+hws.length+'</b><span>שיעורי בית שהוגשו</span></div><div><b class="'+(late?'down':'')+'">'+late+'</b><span>באיחור</span></div></div>';
    }
    s+='<div class="stack"><button class="btn block tonal" data-a="closeSheet">סגירה</button></div>';
    sheet(s);
  },
  delClass(d){sheet('<h2>למחוק את הכיתה?</h2><p>הכיתה, העדכונים, שיעורי הבית והמבחנים שלה יימחקו לכולם.</p><div class="stack"><button class="btn block danger" data-a="delClassYes" data-code="'+d.code+'">מחיקת הכיתה</button><button class="btn block ghost" data-a="closeSheet">ביטול</button></div>')},
  async delClassYes(d){
    closeSheet();const code=d.code;
    try{
      const ops=[];COLS.slice(1).forEach(col=>C[col].filter(x=>x.code===code).forEach(x=>ops.push(col+'/'+x.id)));
      await Promise.all(ops.map(p=>DB.doc(p).delete()));await DB.doc('classes/'+code).delete();
      D.classCodes=myCodes().filter(c=>c!==code);save();startSync();go('classes');toast('הכיתה נמחקה');
    }catch(e){dbFail(e)}
  },
  leaveClass(d){sheet('<h2>לצאת מהכיתה?</h2><p>תפסיקו לקבל ממנה עדכונים. אפשר להצטרף שוב עם הקוד.</p><div class="stack"><button class="btn block danger" data-a="leaveYes" data-code="'+d.code+'">יציאה</button><button class="btn block ghost" data-a="closeSheet">ביטול</button></div>')},
  async leaveYes(d){closeSheet();try{await DB.doc('members/'+d.code+'_'+U.id).delete()}catch(e){}D.classCodes=myCodes().filter(c=>c!==d.code);save();startSync();go('classes')},
  rename(){sheet('<h2>שם</h2><form data-f="rename" class="stack" novalidate><input class="inp" name="name" value="'+esc(U.name)+'" autocomplete="given-name"><button class="btn block" type="submit">שמירה</button></form>')},
  chpw(){sheet('<h2>שינוי סיסמה</h2><form data-f="chpw" novalidate style="margin-top:16px"><div class="field"><label class="lbl">סיסמה נוכחית</label><input class="inp" name="old" type="password" autocomplete="current-password"></div><div class="field"><label class="lbl">סיסמה חדשה</label><input class="inp" name="new" type="password" autocomplete="new-password"></div><div class="field"><label class="lbl">אימות סיסמה חדשה</label><input class="inp" name="new2" type="password" autocomplete="new-password"></div><div class="err" id="err2" role="alert"></div><button class="btn block" type="submit">שמירה</button></form>')},
  logout(){sheet('<h2>להתנתק?</h2><p>הנתונים שלכם נשמרים ויחכו לכם כשתתחברו שוב.</p><div class="stack"><button class="btn block danger" data-a="logoutYes">התנתקות</button><button class="btn block ghost" data-a="closeSheet">ביטול</button></div>')},
  delAccount(){
    const pw=FU&&FU.providerData&&FU.providerData.some(x=>x.providerId==='password');
    sheet('<h2>למחוק את החשבון?</h2><p>'+(isT()?'החשבון, כל הכיתות שלך והעדכונים, שיעורי הבית והמבחנים שבהן יימחקו לצמיתות, גם אצל התלמידים.':'החשבון, המבחנים האישיים וההצטרפות לכיתות יימחקו לצמיתות.')+' אי אפשר לשחזר.</p><form data-f="delAccount" class="stack" novalidate>'+(pw?'<input class="inp" name="pw" type="password" placeholder="הקלידו סיסמה לאישור" autocomplete="current-password">':'')+'<div class="err" id="err2" role="alert"></div><button class="btn block danger" type="submit">מחיקה לצמיתות</button><button class="btn block ghost" type="button" data-a="closeSheet">ביטול</button></form>');
  },
  async logoutYes(){closeSheet();await flushSave();try{await signOut(auth)}catch(e){}},
  doc(d){const x=DOCS[d.k];sheet('<h2>'+x[0]+'</h2><p>'+x[1]+'</p><div class="stack"><button class="btn block tonal" data-a="closeSheet">סגירה</button></div>')},
  setPref(d){D.settings[d.k]=d.v;if(d.k==='theme'){applyTheme(d.v);setTheme(d.v)}save();render(false)},
  toggle(d){
    const n=D.settings.notif;n[d.k]=!n[d.k];save();render(false);
    if(n[d.k]&&window.Notification&&Notification.permission==='default'){try{Notification.requestPermission()}catch(e){}}
  }
};

/* ================= events / reminders / boot ================= */
document.addEventListener('click',ev=>{const el=ev.target.closest('[data-a]');if(!el||el.tagName==='INPUT')return;const f=A[el.dataset.a];if(f){ev.preventDefault();f(el.dataset,el)}});
document.addEventListener('change',ev=>{if(ev.target.id==='rt'&&D){D.settings.reminderTime=ev.target.value||'18:00';save()}});
document.addEventListener('submit',ev=>{const f=ev.target.closest('form[data-f]');if(!f)return;ev.preventDefault();const h=F[f.dataset.f];if(h)h(new FormData(f))});
function checkNotify(){
  if(!D||isT()||!window.Notification||Notification.permission!=='granted')return;
  const t=todayStr(),now=new Date(),hm=pad(now.getHours())+':'+pad(now.getMinutes());
  if(D.lastNotified===t||hm<D.settings.reminderTime)return;
  const n=D.settings.notif,tm=addDays(t,1);let msg=null;
  const due=hwMine().filter(h=>!hwIsDone(h)&&h.due>=t&&h.due<=tm);
  if(n.hw&&due.length)msg='📚 יש לכם '+(due.length===1?'שיעורי בית אחד':due.length+' שיעורי בית')+' להגשה עד מחר.';
  const ex=examsAll().find(e=>e.date>=t&&diff(t,e.date)<=3);
  if(!msg&&n.exam&&ex)msg='🎯 המבחן ב'+ex.subject+' '+rel(diff(t,ex.date))+'.';
  if(msg){try{new Notification('Tutor',{body:msg});D.lastNotified=t;save()}catch(e){}}
}
function boot(){
  applyTheme(getTheme());go('splash');
  onAuthStateChanged(auth,async fu=>{
    if(!fu){stopSync();U=null;D=null;FU=null;applyTheme(getTheme());navEl.hidden=true;go('welcome');return}
    FU=fu;
    try{
      const s=await getDoc(fDoc(fs,'users',fu.uid));let prof=s.exists()?s.data():null;
      if(!prof&&pending){prof={name:pending.name,email:fu.email||pending.email,role:pending.role,createdAt:Date.now()};await setDoc(fDoc(fs,'users',fu.uid),prof);pending=null}
      if(!prof){go('role');return}
      await enter(fu,prof);
    }catch(e){toast('לא הצלחנו להתחבר. בדקו את החיבור.');go('welcome')}
  });
  setInterval(checkNotify,60000);setTimeout(checkNotify,1500);
  document.addEventListener('visibilitychange',()=>{if(document.hidden)flushSave();else{checkNotify();if(D&&['home','exams','hw'].includes(V.name))render(false)}});
  window.addEventListener('pagehide',flushSave);
}
boot();
</script>
